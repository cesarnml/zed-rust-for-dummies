<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Zed Rust for Dummies">
  <title>Two windows, two themes</title>
  <!--
    The feature this site documents, in one mark: two identical windows, one on
    the configured theme and one on a per-window override.
    Flat shapes and heavy strokes on purpose — gradients and fine detail turn to
    mush at 16px, which is the size that actually matters.
  -->
  <rect width="32" height="32" rx="7.5" fill="#141621"/>

  <!-- Back window — the configured (settings) theme. -->
  <rect x="4.5" y="6.5" width="15" height="13" rx="2.6" fill="#2b3247"/>
  <path d="M4.5 10.3h15" stroke="#414a63" stroke-width="1.4"/>
  <circle cx="7.2" cy="8.4" r="0.85" fill="#414a63"/>

  <!-- Front window — the per-window override. -->
  <rect x="12.5" y="12.5" width="15" height="13" rx="2.6"
        fill="#ef8f3c" stroke="#141621" stroke-width="1.7"/>
  <path d="M13.4 16.3h13.2" stroke="#141621" stroke-opacity=".42" stroke-width="1.4"/>
  <circle cx="15.9" cy="14.4" r="0.85" fill="#141621" fill-opacity=".42"/>
</svg>
